extend schema
    @link(
        url: "https://specs.apollo.dev/federation/v2.7"
        import: ["@key", "@shareable", "@external"]
    )

type Query {
    allProducts: [Product]
    product(id: ID!): Product
}

type Product @key(fields: "id") @key(fields: "sku") {
    id: ID!
    sku: String
    name: String
    createdBy: User
}

type User
    @key(fields: "email country { a }")
    @key(fields: "email country { b }") {
    email: ID!
    country: Country
}

type Country @key(fields: "a") {
    a: String
    b: String
}
